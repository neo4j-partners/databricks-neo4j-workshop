<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525B"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333EA"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="#FFFFFF"/>

  <!-- Row 1: question, supervisor, answer -->
  <rect x="24" y="26" width="170" height="46" rx="23" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/>
  <text x="109" y="55" text-anchor="middle" font-size="15" fill="#27272A">Question</text>

  <line x1="200" y1="49" x2="284" y2="49" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="290" y="14" width="380" height="70" rx="10" fill="#F1EEFB" stroke="#6E56CF" stroke-width="2"/>
  <text x="480" y="41" text-anchor="middle" font-size="16" font-weight="bold" fill="#3B2E7E">Supervisor</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#4C3F91">Claude Sonnet 5, routing on where a question starts</text>

  <line x1="676" y1="49" x2="760" y2="49" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="718" y="36" text-anchor="middle" font-size="11.5" fill="#52525B">when it has enough</text>

  <rect x="766" y="26" width="170" height="46" rx="23" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/>
  <text x="851" y="55" text-anchor="middle" font-size="15" fill="#27272A">Answer</text>

  <!-- Supervisor to the three tools -->
  <path d="M 480 84 L 480 108 L 155 104 L 155 174" fill="none" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 480 84 L 480 174" fill="none" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 480 84 L 480 108 L 805 104 L 805 174" fill="none" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row 2: the three tools -->
  <rect x="20" y="180" width="270" height="104" rx="10" fill="#FDEEEA" stroke="#E8501F" stroke-width="2"/>
  <text x="155" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#8C2A0C">genie_node</text>
  <text x="155" y="230" text-anchor="middle" font-size="12.5" fill="#7A3520">Natural language to SQL</text>
  <text x="155" y="249" text-anchor="middle" font-size="12.5" fill="#7A3520">The only tool that can see</text>
  <text x="155" y="267" text-anchor="middle" font-size="12.5" fill="#7A3520">a sensor reading</text>

  <rect x="345" y="180" width="270" height="104" rx="10" fill="#E8F3FF" stroke="#0B7FD4" stroke-width="2"/>
  <text x="480" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A4E82">cypher_node</text>
  <text x="480" y="230" text-anchor="middle" font-size="12.5" fill="#125C93">Question to Cypher, then a</text>
  <text x="480" y="249" text-anchor="middle" font-size="12.5" fill="#125C93">read transaction. One retry,</text>
  <text x="480" y="267" text-anchor="middle" font-size="12.5" fill="#125C93">with the error attached</text>

  <rect x="670" y="180" width="270" height="104" rx="10" fill="#E8F3FF" stroke="#0B7FD4" stroke-width="2"/>
  <text x="805" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A4E82">graphrag_node</text>
  <text x="805" y="230" text-anchor="middle" font-size="12.5" fill="#125C93">Vector search over manual</text>
  <text x="805" y="249" text-anchor="middle" font-size="12.5" fill="#125C93">chunks, then a Cypher tail</text>
  <text x="805" y="267" text-anchor="middle" font-size="12.5" fill="#125C93">from every hit</text>

  <!-- Results return to the supervisor -->
  <path d="M 940 232 L 952 232 L 952 6 L 480 6 L 480 12" fill="none" stroke="#9333EA" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-dash)"/>
  <text x="716" y="130" text-anchor="middle" font-size="12" fill="#7E22CE">Every result goes back to the supervisor, which is free to pick again</text>

  <!-- Tools down to their stores -->
  <line x1="155" y1="284" x2="155" y2="336" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="480" y1="284" x2="480" y2="336" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="805" y1="284" x2="805" y2="336" stroke="#52525B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row 3: the two stores -->
  <rect x="20" y="342" width="270" height="76" rx="10" fill="#FBF4F2" stroke="#E8501F" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="155" y="369" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8C2A0C">Databricks Lakehouse</text>
  <text x="155" y="392" text-anchor="middle" font-size="12.5" fill="#7A3520">Delta tables of sensor telemetry,</text>
  <text x="155" y="409" text-anchor="middle" font-size="12.5" fill="#7A3520">where scanning them is cheap</text>

  <rect x="345" y="342" width="595" height="76" rx="10" fill="#F2F8FE" stroke="#0B7FD4" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="642" y="369" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0A4E82">Your own Neo4j Aura instance</text>
  <text x="642" y="392" text-anchor="middle" font-size="12.5" fill="#125C93">The fleet you loaded in Lab 2 and the manual chunks you embedded in Lab 3,</text>
  <text x="642" y="409" text-anchor="middle" font-size="12.5" fill="#125C93">in one graph. Lab 6 writes the agent's memory here too</text>

  <!-- Footer -->
  <line x1="20" y1="446" x2="940" y2="446" stroke="#E4E4E7" stroke-width="1.5"/>
  <text x="480" y="472" text-anchor="middle" font-size="13" fill="#3F3F46">The whole graph is logged to Unity Catalog and served from a Model Serving endpoint</text>
  <text x="480" y="491" text-anchor="middle" font-size="13" fill="#3F3F46">that authenticates as a service principal.</text>
</svg>
