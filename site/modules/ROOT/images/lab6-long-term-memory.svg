<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#FFFFFF"/>

  <!-- ================= Left panel: POLE+O Entity Model ================= -->
  <rect x="30" y="30" width="440" height="460" rx="10" fill="#E6F5F3" stroke="#0E9188" stroke-width="2"/>
  <text x="250" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A6F68">POLE+O Entity Model</text>
  <line x1="50" y1="80" x2="450" y2="80" stroke="#0E9188" stroke-width="1" opacity="0.35"/>

  <!-- Person -->
  <circle cx="70" cy="118" r="13" fill="#0E9188" stroke="#0A6F68" stroke-width="1.8"/>
  <text x="98" y="114" font-size="13.5" font-weight="bold" fill="#27272A">Person</text>
  <text x="98" y="131" font-size="11" fill="#52525B">Customers, employees, stakeholders</text>

  <!-- Organization -->
  <circle cx="70" cy="194" r="13" fill="#C99A2E" stroke="#8C6A15" stroke-width="1.8"/>
  <text x="98" y="190" font-size="13.5" font-weight="bold" fill="#27272A">Organization</text>
  <text x="98" y="207" font-size="11" fill="#52525B">Companies, teams, departments</text>

  <!-- Location -->
  <circle cx="70" cy="270" r="13" fill="#E8501F" stroke="#B03A12" stroke-width="1.8"/>
  <text x="98" y="266" font-size="13.5" font-weight="bold" fill="#27272A">Location</text>
  <text x="98" y="283" font-size="11" fill="#52525B">Addresses, regions, countries</text>

  <!-- Event -->
  <circle cx="70" cy="346" r="13" fill="#0B7FD4" stroke="#0A4E82" stroke-width="1.8"/>
  <text x="98" y="342" font-size="13.5" font-weight="bold" fill="#27272A">Event</text>
  <text x="98" y="359" font-size="11" fill="#52525B">Transactions, decisions, meetings</text>

  <!-- Object -->
  <circle cx="70" cy="422" r="13" fill="#2E9E4F" stroke="#1F7A38" stroke-width="1.8"/>
  <text x="98" y="418" font-size="13.5" font-weight="bold" fill="#27272A">Object</text>
  <text x="98" y="435" font-size="11" fill="#52525B">Accounts, products, documents</text>

  <!-- ================= Right panel: Key Capabilities ================= -->
  <rect x="500" y="30" width="430" height="460" rx="10" fill="#E6F5F3" stroke="#0E9188" stroke-width="2"/>
  <text x="715" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A6F68">Key Capabilities</text>
  <line x1="520" y1="80" x2="920" y2="80" stroke="#0E9188" stroke-width="1" opacity="0.35"/>

  <circle cx="540" cy="118" r="13" fill="#FFFFFF" stroke="#2E9E4F" stroke-width="1.8"/>
  <path d="M -6 0 L -1 5 L 7 -6" transform="translate(540,118)" fill="none" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="123" font-size="13.5" fill="#27272A">Cross-conversation knowledge persistence</text>

  <circle cx="540" cy="194" r="13" fill="#FFFFFF" stroke="#2E9E4F" stroke-width="1.8"/>
  <path d="M -6 0 L -1 5 L 7 -6" transform="translate(540,194)" fill="none" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="199" font-size="13.5" fill="#27272A">Temporal relationships (valid from/to)</text>

  <circle cx="540" cy="270" r="13" fill="#FFFFFF" stroke="#2E9E4F" stroke-width="1.8"/>
  <path d="M -6 0 L -1 5 L 7 -6" transform="translate(540,270)" fill="none" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="275" font-size="13.5" fill="#27272A">Configurable entity subtypes</text>

  <circle cx="540" cy="346" r="13" fill="#FFFFFF" stroke="#2E9E4F" stroke-width="1.8"/>
  <path d="M -6 0 L -1 5 L 7 -6" transform="translate(540,346)" fill="none" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="351" font-size="13.5" fill="#27272A">Automatic extraction from conversations</text>

  <circle cx="540" cy="422" r="13" fill="#FFFFFF" stroke="#2E9E4F" stroke-width="1.8"/>
  <path d="M -6 0 L -1 5 L 7 -6" transform="translate(540,422)" fill="none" stroke="#2E9E4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="568" y="427" font-size="13.5" fill="#27272A">Vector search across all entity types</text>
</svg>
